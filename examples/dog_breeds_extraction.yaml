# =============================================================================
# WikiWhisker — Dog Breeds Extraction Questions
# =============================================================================
#
# This file defines WHAT data to extract from each accepted dog breed page.
#
# Dataset goal:
#   Produce a JSON dataset that answers three key questions for every living
#   dog breed found on Wikipedia's "List of dog breeds" page:
#
#     1. health_issues    — Does this breed have notable health problems?
#     2. working_dog      — Is this breed a working dog?
#     3. family_friendly  — Is this breed family-friendly?
#
# STRUCTURE
# ─────────
# This file uses the two-section extraction schema:
#
#   questions:        Deterministic fields — resolved from page metadata.
#                     Zero LLM cost.  Runs instantly.
#
#   llm_extraction:   ALL LLM-answered fields, sent in a SINGLE API call
#                     per page.  The LLM returns one JSON object with all
#                     answers at once.
#
# COST NOTE:
#   With up to 500 accepted pages and only ONE LLM batch call per page,
#   expect ~500 API calls for extraction (vs ~1,500 with per-field calls).
#
# CLI usage:
#   python wiki_whisker.py "List of dog breeds" \
#       --traversal-rules   examples/dog_breeds_traversal.yaml \
#       --extraction-questions examples/dog_breeds_extraction.yaml \
#       --output results/dog_breeds.json \
#       --model gpt-4o
# =============================================================================

# ---------------------------------------------------------------------------
# Deterministic fields  (no LLM — fast and free)
# ---------------------------------------------------------------------------

questions:

  - field_name: page_title
    label: "Wikipedia Page Title"
    description: "Canonical Wikipedia article title for this dog breed."
    source: "title"
    type: string

  - field_name: breed_name
    label: "Breed Name"
    description: "Common name of the dog breed, from the infobox or page title."
    source: "infobox:name"
    fallback_sources:
      - "infobox:Name"    # some infobox templates capitalise the field name
      - "title"           # last resort: use the Wikipedia page title
    type: string
    default: null


# ---------------------------------------------------------------------------
# LLM batch extraction  (ONE API call per page — returns all fields at once)
# ---------------------------------------------------------------------------
#
# EXTINCT BREEDS:
#   The traversal LLM gate is configured to exclude extinct breeds before
#   extraction begins.  However, if an extinct breed's page passes through
#   anyway (e.g. because the intro summary was ambiguous), the extraction
#   prompt below instructs the LLM to return "Unknown" for all three boolean
#   fields so that null is written to the output rather than a misleading
#   true/false value.

llm_extraction:

  prompt_preamble: >
    Read the Wikipedia article for this dog breed carefully and answer
    each of the following questions.  Return ONLY a valid JSON object with
    exactly the keys listed — no extra text, no markdown, no explanation.

    Important rules that apply to ALL questions:
      - If the breed is extinct, answer "Unknown" for every question.
      - Base your answers strictly on what the Wikipedia article states.
        Do not use outside knowledge beyond what is in the article text.

  fields:

    # ── 1. Health issues ────────────────────────────────────────────────────

    - field_name: health_issues
      label: "Significant Health Issues"
      question: >
        Does this breed have significant, breed-specific health problems
        that a prospective owner should seriously consider?
        Examples include hip dysplasia, elbow dysplasia, brachycephalic
        airway syndrome, hereditary eye conditions, serious heart defects,
        epilepsy, bloat (GDV), or any other serious condition that the
        article explicitly highlights as a known concern for the breed.
        Answer "True" if one or more significant breed-specific health
        concerns are described in the article.
        Answer "False" if the breed is described as generally healthy, or
        only very minor or common-to-all-dogs issues are mentioned.
        Answer "Unknown" ONLY if the breed is extinct OR the article
        contains no health information whatsoever.
      options:
        - "True"
        - "False"
        - "Unknown"
      default: "Unknown"

    # ── 2. Working dog ──────────────────────────────────────────────────────

    - field_name: working_dog
      label: "Working Dog"
      question: >
        Is this breed a working dog — meaning it was originally bred for,
        or is today widely used in, a practical working role?
        Working roles include: herding livestock, guarding property or
        people, search and rescue, police or military service, pulling
        sleds, hunting (flushing, tracking, retrieving), or trained
        assistance/service work.
        Answer "True" if the article describes the breed as a working,
        herding, sporting, hound, terrier, or service breed, OR if it is
        primarily known for a working function rather than companionship.
        Answer "False" if the breed is primarily described as a companion,
        toy, lap dog, or show breed with no significant working history.
        Answer "Unknown" ONLY if the breed is extinct OR the article lacks
        enough information to make a determination.
      options:
        - "True"
        - "False"
        - "Unknown"
      default: "Unknown"

    # ── 3. Family-friendly ──────────────────────────────────────────────────

    - field_name: family_friendly
      label: "Family-Friendly"
      question: >
        Is this breed generally considered family-friendly — a good fit
        for a typical family household, including children and possibly
        other pets?
        Answer "True" if the article describes the breed as good-natured,
        friendly, gentle, good with children, or otherwise well-suited to
        family life.
        Answer "False" if the article describes the breed as requiring
        experienced handlers, prone to aggression, dominant, having a
        strong prey drive toward small animals, or otherwise unsuitable
        for most family households. Any specific mention of problems with biting, aggression, 
        or poor temperament should be considered a negative indicator.
        Any breed with a history of being used for fighting (e.g. bull-baiting, dog fighting) 
        should also be considered a negative indicator. As should any that have specific legislative restrictions 
        (e.g. banned or restricted in certain countries or regions due to violence).
        Answer "Unknown" ONLY if the breed is extinct OR the article lacks
        enough temperament or behavioural information.
      options:
        - "True"
        - "False"
        - "Unknown"
      default: "Unknown"

# =============================================================================
# Sample output record
# =============================================================================
#
# The LLM makes ONE call per page and returns all three answers at once:
#
# {
#   "_page_title":       "Labrador Retriever",
#   "_wikipedia_url":    "https://en.wikipedia.org/wiki/Labrador_Retriever",
#   "_is_starting_page": false,
#   "page_title":        "Labrador Retriever",
#   "breed_name":        "Labrador Retriever",
#   "country_of_origin": "Canada",
#   "categories":        ["Retrievers", "Dog breeds originating in Canada", ...],
#   "health_issues":     "True",      ← hip dysplasia, eye conditions mentioned
#   "working_dog":       "True",      ← widely used as service/guide dogs
#   "family_friendly":   "True"       ← renowned family companion
# }
#
# Extinct breed example (should be filtered at traversal, but handled safely):
# {
#   "_page_title":       "Turnspit dog",
#   "_wikipedia_url":    "https://en.wikipedia.org/wiki/Turnspit_dog",
#   "_is_starting_page": false,
#   "page_title":        "Turnspit dog",
#   "breed_name":        "Turnspit dog",
#   "country_of_origin": "United Kingdom",
#   "categories":        ["Extinct dog breeds", ...],
#   "health_issues":     "Unknown",   ← extinct: not applicable
#   "working_dog":       "Unknown",   ← extinct: not applicable
#   "family_friendly":   "Unknown"    ← extinct: not applicable
# }
