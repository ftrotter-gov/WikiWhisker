# =============================================================================
# WikiWhisker — Traversal Rules YAML  (fully annotated reference)
# =============================================================================
#
# HOW WIKIWHISKER WORKS (quick orientation)
# ──────────────────────────────────────────
# 1. You give WikiWhisker one or more "starting pages" on the command line
#    (e.g. "List of dog breeds").
# 2. WikiWhisker collects every Wikipedia link found on those starting pages.
#    Each linked page is a "candidate secondary page".
# 3. This file controls which of those candidates are ACCEPTED and crawled.
#    Candidates pass through two optional filter layers (see below).
# 4. The extraction-questions YAML (a separate file) controls what data is
#    pulled from each accepted page and written to the output JSON.
#
# QUICK START — if you just want to get going, your entire traversal file
# can be as simple as:
#
#   max_secondary_pages: 50
#   link_filters: {}
#
# That accepts every linked page, up to 50, with no filtering.
# Copy the fuller template below into config/<name>_traversal.yaml and
# uncomment whichever filters you need.
#
# LOCATION: copy this file to  config/<name>_traversal.yaml  and edit it.
# The config/ directory is git-ignored by default; examples/ is tracked.
#
# CLI usage:
#   python wiki_whisker.py "List of dog breeds" \
#       --traversal-rules   config/dog_breeds_traversal.yaml \
#       --extraction-questions config/dog_breeds_extraction.yaml \
#       --output results/dog_breeds.json \
#       --model gpt-4o
# =============================================================================

# ---------------------------------------------------------------------------
# Crawl limits
# ---------------------------------------------------------------------------

# Hard cap on accepted secondary pages.  The crawl stops — and no further
# candidates are even evaluated — as soon as this many pages have been
# accepted.  Pages that appear later in the link list are skipped entirely.
# Default: 200.
max_secondary_pages: 200

# Seconds to sleep between Wikipedia API calls.  Please be polite.  Default: 0.5
request_delay_seconds: 0.5

# If true, the starting page(s) themselves are also extracted and included in
# the output records (marked with "_is_starting_page": true).  Default: false
include_starting_pages_in_output: false

# ---------------------------------------------------------------------------
# TWO-LAYER FILTER PIPELINE
# ---------------------------------------------------------------------------
#
# Candidates flow through the two filters below in order:
#
#   [all linked pages]
#        │
#        ▼
#   link_filters  ◀─── fast, deterministic, no LLM cost
#        │
#        ▼
#   llm_traversal_filter  ◀─── slower, flexible, costs one API call per page
#        │
#        ▼
#   [accepted secondary pages]
#
# TIP: If you enable the LLM filter but set NO link_filters, every linked
# page is passed to the LLM — potentially hundreds of API calls.  Use
# link_filters first to narrow down candidates cheaply.

# ---------------------------------------------------------------------------
# link_filters — deterministic pre-filters  (no LLM, fast and cheap)
# ---------------------------------------------------------------------------
# All filters that are SET must ALL pass for a page to be accepted.
# Omitting a key (or leaving link_filters empty) means "no restriction on
# that dimension" — all candidates pass through to the next stage.

link_filters:

  # (empty = no active filters; every linked page is a candidate)
  # Uncomment any combination of filters below to restrict which pages pass.

  # ── Title substring filters ──────────────────────────────────────────────

  # Accept only pages whose title contains at least one of these substrings
  # (case-insensitive).  A single string or a list of strings.
  #
  # title_contains: "dog"
  # title_contains:
  #   - "dog"
  #   - "hound"
  #   - "retriever"

  # Reject pages whose title contains any of these substrings (case-insensitive).
  #
  # title_not_contains: "disambiguation"
  # title_not_contains:
  #   - "disambiguation"
  #   - "list of"
  #   - "index"

  # ── Title regex filter ───────────────────────────────────────────────────
  # Accept only pages whose title matches this Python regex (re.IGNORECASE).
  #
  # title_matches_regex: "^.+\\s+\\(dog breed\\)$"

  # ── Category filters  (triggers one extra API call per candidate page) ───

  # Accept only pages that have at least one Wikipedia category containing
  # at least one of these substrings (case-insensitive).
  #
  # category_contains: "dog breeds"
  # category_contains:
  #   - "dog breeds"
  #   - "working dogs"

  # Reject pages that have any Wikipedia category containing any of these
  # substrings (case-insensitive).
  #
  # category_not_contains: "stub"
  # category_not_contains:
  #   - "stub"
  #   - "disambiguation"

# ---------------------------------------------------------------------------
# llm_traversal_filter — LLM-based filter  (runs AFTER link_filters)
# ---------------------------------------------------------------------------
# Uses the ChatGPT API (via litellm) to ask YES/NO about each candidate page
# that passed the deterministic filters above.
#
# Requires OPENAI_API_KEY (or the relevant key for --model) in the environment.
# Each candidate that passes link_filters costs one LLM API call when this
# filter is enabled.
#
# To activate this filter:
#   1. Set  enabled: true
#   2. Uncomment  prompt:  and write your YES/NO question
#   3. Make sure OPENAI_API_KEY is set in your environment (or .env file)

llm_traversal_filter:

  # Set to true to activate.  Default: false
  enabled: false

  # Natural language instruction.  The page title (and optionally the Wikipedia
  # intro paragraph and/or category list) are injected automatically.
  # The LLM must answer YES (include) or NO (exclude).
  #
  # prompt: >
  #   You are deciding whether a Wikipedia page is about a specific dog breed
  #   (not a list, category, or disambiguation page).
  #   Answer YES if the page is about a single, named dog breed.
  #   Answer NO otherwise.

  # The options below have no effect when enabled: false, but are shown here
  # as documentation for when you activate the filter.

  # If true, the Wikipedia intro-paragraph text is passed to the LLM.
  # This gives the LLM better context but costs a little more.  Default: true
  # include_page_summary: true

  # If true, the page's Wikipedia category list is also passed to the LLM.
  # Adds more context but triggers an extra API call per page.  Default: false
  # include_categories: false
