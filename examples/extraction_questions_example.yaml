# =============================================================================
# WikiWhisker — Extraction Questions YAML  (fully annotated reference)
# =============================================================================
#
# This file defines WHAT data to extract from each visited Wikipedia page
# and HOW that data maps to fields in the output JSON file.
#
# RELATIONSHIP TO THE TRAVERSAL FILE
# ────────────────────────────────────
# The traversal rules YAML (the other config file) controls WHICH Wikipedia
# pages are visited.  This file controls WHAT is extracted from each of them.
# Both files are required to run WikiWhisker.
#
# QUICK START — the simplest possible extraction config is just one field:
#
#   questions:
#     - field_name: page_title
#       source: "title"
#       type: string
#
# That gives you one field per record: the Wikipedia page title.
# Add more fields under "questions:" as needed.
#
# LOCATION: copy this file to  config/<name>_extraction.yaml  and edit it.
# The config/ directory is git-ignored by default; examples/ is tracked.
#
# CLI usage:
#   python wiki_whisker.py "List of dog breeds" \
#       --traversal-rules   config/dog_breeds_traversal.yaml \
#       --extraction-questions config/dog_breeds_extraction.yaml \
#       --output results/dog_breeds.json \
#       --model gpt-4o
#
# =============================================================================
# Field definition keys
# =============================================================================
#
#   field_name   (required)
#       Key used for this value in every output JSON record.
#       No spaces recommended.
#
#   label        (optional)
#       Human-readable display name.  Appears in output JSON meta.output_schema.
#
#   description  (optional)
#       Prose description.  Passed as context to the LLM when source is "llm".
#
#   source       (required)
#       Where to read the value.  One of:
#
#         "title"
#             The Wikipedia page title itself.
#
#         "category_list"
#             Full list of Wikipedia categories for the page (JSON array).
#             Use with  type: list.
#
#         "infobox:<field_name>"
#             Named parameter from the page's first Infobox template.
#             e.g.  source: "infobox:birth_date"
#             Field names are case-sensitive; match the infobox parameter name
#             exactly.
#
#             HOW TO FIND INFOBOX FIELD NAMES FOR ANY WIKIPEDIA PAGE:
#               1. Open the Wikipedia article in your browser.
#               2. Click "Edit" (or "Edit source") at the top of the page.
#               3. Look for a block starting with  {{Infobox ...
#               4. The parameter names inside (e.g. |name=, |country=) are the
#                  field names.  Use them exactly as written — they are case-
#                  sensitive, and different pages may use different names for
#                  similar concepts (e.g. "country" vs. "origin" vs. "Country").
#               5. Use fallback_sources (see below) to handle variations.
#
#         "wikidata:<property_id>"
#             Wikidata property on the item linked to this page.
#             e.g.  source: "wikidata:P31"   (instance of)
#                   source: "wikidata:P495"  (country of origin)
#             Multiple values: first returned for scalar types;
#             all returned for  type: list.
#
#             Wikidata values are returned as Q-IDs (e.g. Q39367).  Q-IDs are
#             Wikidata's unique identifiers for concepts.  You can look up any
#             Q-ID at  https://www.wikidata.org/wiki/<Q-ID>
#             (e.g. https://www.wikidata.org/wiki/Q39367 = "dog breed").
#             See docs/schema_reference.md for a list of common property IDs.
#
#         "llm"
#             Ask the LLM the question in  llm_prompt  about the page text.
#             Requires  llm_prompt  to be set.
#             Uses the model specified by  --model  (default: gpt-4o).
#             Requires OPENAI_API_KEY in environment (or relevant provider key).
#
#             COST: Each "source: llm" field makes ONE API call per accepted page.
#             Example: 5 LLM fields × 200 pages = 1,000 API calls.
#             Where possible, prefer  source: "infobox:..."  or
#             source: "wikidata:..."  (both are free — no API calls).
#             Use "llm" only for things that can't be read from structured data.
#
#   fallback_sources  (optional)
#       Ordered list of additional sources tried when the primary source
#       returns empty/null.  Same syntax as "source".
#       This is especially useful for infobox fields, which use different
#       parameter names across page types and even across individual pages
#       (e.g. "name" vs. "Name" — infobox field names are case-sensitive).
#
#   type         (optional, default: "string")
#       Output type coercion.
#         string  — cast to string (joins lists with ", ")
#         list    — always return a JSON array
#         int     — parse as integer (strips commas)
#         float   — parse as float   (strips commas)
#         bool    — "yes"/"true"/"1" → true, everything else → false
#
#   default      (optional, default: null)
#       Value written when all sources (including fallbacks) return empty.
#       For LLM fields: also used when the LLM response does not exactly match
#       one of the values in  llm_options.
#
#   llm_prompt   (required when source is "llm")
#       Natural language question asked of the LLM about the page text.
#       The full wikitext (up to 12 000 characters) is provided as context.
#
#   llm_options  (optional, only used when source is "llm")
#       If provided, the LLM is constrained to respond with exactly one of
#       these values (multiple-choice mode).  If the LLM response does not
#       exactly match one of the listed values, the field's  default  value
#       is used instead.  It is good practice to include an "Unknown" option
#       so the LLM has a graceful fallback within the constrained set.
#
# =============================================================================

# ---------------------------------------------------------------------------
# Example: dog breed taxonomy
# ---------------------------------------------------------------------------

# Required top-level key.  All field definitions go under this list.
# (Alternatively, the file can be a bare YAML list without the "questions:"
# wrapper — but the wrapper form is recommended for clarity.)
questions:

  # ── Identity ──────────────────────────────────────────────────────────────

  - field_name: page_title
    label: "Wikipedia Page Title"
    description: "Canonical Wikipedia article title."
    source: "title"
    type: string

  - field_name: breed_name
    label: "Breed Name"
    description: "Common name of the dog breed."
    source: "infobox:name"
    fallback_sources:
      - "infobox:Name"    # some infobox templates capitalize the field name
      - "title"           # last resort: use the page title itself
    type: string
    default: null

  # ── Structured fields (infobox / Wikidata — no LLM cost) ─────────────────

  - field_name: country_of_origin
    label: "Country of Origin"
    description: "Country where the breed was developed."
    source: "infobox:country"
    fallback_sources:
      - "infobox:origin"    # alternate infobox parameter name used on some pages
      - "wikidata:P495"     # Wikidata "country of origin" property — reliable fallback
    type: string
    default: null

  - field_name: weight_kg
    label: "Weight (kg)"
    description: "Typical adult weight, from the infobox (kept as string)."
    source: "infobox:weight"
    type: string
    default: null

  - field_name: categories
    label: "Wikipedia Categories"
    description: "All Wikipedia categories assigned to this page."
    source: "category_list"
    type: list
    default: []

  - field_name: wikidata_instance_of
    label: "Wikidata: instance of (P31)"
    description: >
      Wikidata Q-IDs for what this article is an instance of.
      Q-IDs are Wikidata's unique concept identifiers (e.g. Q39367 = "dog breed").
      Look up any Q-ID at https://www.wikidata.org/wiki/<Q-ID>
    source: "wikidata:P31"
    type: list
    default: []

  # ── LLM-extracted fields (use the ChatGPT API) ───────────────────────────
  # Use these for information that cannot be read from structured infobox or
  # Wikidata fields.
  #
  # COST REMINDER: each field below costs ONE API call per accepted page.
  # With 200 accepted pages, the two fields below = 400 API calls total.
  # Minimize LLM fields and prefer infobox/wikidata sources where possible.

  - field_name: breed_size_category
    label: "Size Category"
    description: >
      General size classification of the breed
      (Toy, Small, Medium, Large, or Giant).
    source: "llm"
    llm_prompt: >
      Based on the Wikipedia article, what is the general size category of
      this dog breed?  Choose the single best option.
    llm_options:
      - "Toy"
      - "Small"
      - "Medium"
      - "Large"
      - "Giant"
      - "Unknown"   # always include a fallback option for the LLM to use when uncertain
    type: string
    default: "Unknown"    # also used if the LLM response doesn't match any option above

  - field_name: primary_purpose
    label: "Primary Purpose"
    description: "What the breed was originally developed to do."
    source: "llm"
    llm_prompt: >
      Based on the Wikipedia article, what was this dog breed originally
      developed to do?  Give a short phrase (e.g. 'herding livestock',
      'hunting small game', 'companionship', 'guarding').
      If unclear, answer 'Unknown'.
    type: string
    default: "Unknown"

# =============================================================================
# Abbreviated sample output JSON record
# =============================================================================
#
# Each record in the output JSON has automatic metadata fields (prefixed with
# "_") plus one key per extraction question defined above.
#
# Success case — all fields found:
# {
#   "_page_title":          "Labrador Retriever",
#   "_wikipedia_url":       "https://en.wikipedia.org/wiki/Labrador_Retriever",
#   "_is_starting_page":    false,
#   "page_title":           "Labrador Retriever",
#   "breed_name":           "Labrador Retriever",
#   "country_of_origin":    "Canada",
#   "weight_kg":            "25–36 kg",
#   "categories":           ["Retrievers", "Dog breeds originating in Canada", ...],
#   "wikidata_instance_of": ["Q39367"],      ← Q39367 = "dog breed" on Wikidata
#   "breed_size_category":  "Large",
#   "primary_purpose":      "retrieving game"
# }
#
# Missing-data case — page has no infobox or LLM couldn't determine a value:
# {
#   "_page_title":          "Some Obscure Breed",
#   "_wikipedia_url":       "https://en.wikipedia.org/wiki/Some_Obscure_Breed",
#   "_is_starting_page":    false,
#   "page_title":           "Some Obscure Breed",
#   "breed_name":           "Some Obscure Breed",   ← fell back to "title" source
#   "country_of_origin":    null,                   ← no infobox or Wikidata value found
#   "weight_kg":            null,
#   "categories":           [],
#   "wikidata_instance_of": [],
#   "breed_size_category":  "Unknown",              ← LLM used the "Unknown" option
#   "primary_purpose":      "Unknown"
# }
