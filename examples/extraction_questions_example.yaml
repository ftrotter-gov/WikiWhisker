# =============================================================================
# WikiWhisker — Extraction Questions YAML  (fully annotated reference)
# =============================================================================
#
# This file defines WHAT data to extract from each visited Wikipedia page
# and HOW that data maps to fields in the output JSON file.
#
# RELATIONSHIP TO THE TRAVERSAL FILE
# ────────────────────────────────────
# The traversal rules YAML controls WHICH Wikipedia pages are visited.
# This file controls WHAT is extracted from each of them.
# Both files are required to run WikiWhisker.
#
# TWO-SECTION SCHEMA
# ───────────────────
# This file has two optional top-level sections:
#
#   questions:
#     Deterministic fields — resolved from page metadata (title, infobox,
#     Wikidata, category list).  Zero LLM cost.  Instant.
#
#   llm_extraction:
#     LLM-answered fields.  ALL fields in this section are batched into a
#     SINGLE API call per page.  The LLM reads the article text once and
#     returns a JSON object with all the answers at once.
#     Cost: ONE API call per accepted page (regardless of how many fields).
#
# You can use either or both sections.  A config with only deterministic
# fields is entirely free.  A config with only llm_extraction still makes
# exactly one LLM call per page.
#
# QUICK START — simplest possible extraction config:
#
#   questions:
#     - field_name: page_title
#       source: "title"
#       type: string
#
# LOCATION: copy this file to  config/<name>_extraction.yaml  and edit it.
# The config/ directory is git-ignored; examples/ is tracked.
#
# CLI usage:
#   python wiki_whisker.py "List of dog breeds" \
#       --traversal-rules   config/dog_breeds_traversal.yaml \
#       --extraction-questions config/dog_breeds_extraction.yaml \
#       --output results/dog_breeds.json \
#       --model gpt-4o
#
# =============================================================================
# DETERMINISTIC FIELD KEYS  (used in the "questions:" section)
# =============================================================================
#
#   field_name   (required)
#       Key used for this value in every output JSON record.
#       No spaces recommended.
#
#   label        (optional)
#       Human-readable display name.  Appears in output JSON meta.output_schema.
#
#   description  (optional)
#       Prose description of what this field contains.
#
#   source       (required)
#       Where to read the value.  One of:
#
#         "title"
#             The Wikipedia page title itself.
#
#         "category_list"
#             Full list of Wikipedia categories for the page (JSON array).
#             Use with  type: list.
#
#         "infobox:<field_name>"
#             Named parameter from the page's first Infobox template.
#             e.g.  source: "infobox:birth_date"
#             Field names are case-sensitive; match the infobox parameter
#             name exactly (see HOW TO FIND INFOBOX FIELD NAMES below).
#
#             HOW TO FIND INFOBOX FIELD NAMES FOR ANY WIKIPEDIA PAGE:
#               1. Open the Wikipedia article in your browser.
#               2. Click "Edit" (or "Edit source") at the top of the page.
#               3. Look for a block starting with  {{Infobox ...
#               4. The parameter names inside (e.g. |name=, |country=) are
#                  the field names.  Use them exactly as written (case-sensitive).
#               5. Use fallback_sources to handle variations (e.g. "name" vs "Name").
#
#         "wikidata:<property_id>"
#             Wikidata property on the item linked to this page.
#             e.g.  source: "wikidata:P31"   (instance of)
#                   source: "wikidata:P495"  (country of origin)
#             Values are returned as Q-IDs (e.g. Q39367 = "dog breed").
#             See docs/schema_reference.md for common property IDs.
#
#   fallback_sources  (optional)
#       Ordered list of additional sources tried when the primary source
#       returns empty/null.  Same syntax as "source".
#       Especially useful for infobox fields that vary across pages.
#
#   type         (optional, default: "string")
#       Output type coercion.
#         string  — cast to string (joins lists with ", ")
#         list    — always return a JSON array
#         int     — parse as integer (strips commas)
#         float   — parse as float   (strips commas)
#         bool    — "yes"/"true"/"1" → true, everything else → false
#
#   default      (optional, default: null)
#       Value written when all sources (including fallbacks) return empty.
#
# =============================================================================
# LLM EXTRACTION FIELD KEYS  (used in the "llm_extraction.fields:" list)
# =============================================================================
#
#   field_name   (required)
#       Key used for this value in every output JSON record.
#
#   label        (optional)
#       Human-readable display name.
#
#   question     (required)
#       Natural language question sent to the LLM about the article text.
#       The full wikitext (up to 12 000 characters) is provided as context.
#       Write clear, unambiguous questions.  Include the allowed answer values
#       directly in the question text so the model is fully constrained.
#
#   options      (optional)
#       If provided, the LLM is constrained to answer with exactly one of
#       these values.  Answers are validated (case-insensitive fallback) and
#       non-matching answers fall back to the  default  value.
#       Best practice: always include an "Unknown" option as a graceful
#       fallback so the LLM has somewhere to go when the article is ambiguous.
#
#   default      (optional, default: null)
#       Value used when the LLM response does not match any option, or when
#       the batch call fails entirely.
#
# =============================================================================

# ---------------------------------------------------------------------------
# Example: dog breed taxonomy
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Deterministic fields  (no LLM — fast and free)
# ---------------------------------------------------------------------------

questions:

  # ── Identity ──────────────────────────────────────────────────────────────

  - field_name: page_title
    label: "Wikipedia Page Title"
    description: "Canonical Wikipedia article title."
    source: "title"
    type: string

  - field_name: breed_name
    label: "Breed Name"
    description: "Common name of the dog breed."
    source: "infobox:name"
    fallback_sources:
      - "infobox:Name"    # some infobox templates capitalize the field name
      - "title"           # last resort: use the page title itself
    type: string
    default: null

  # ── Structured fields (infobox / Wikidata — no LLM cost) ─────────────────

  - field_name: country_of_origin
    label: "Country of Origin"
    description: "Country where the breed was developed."
    source: "infobox:country"
    fallback_sources:
      - "infobox:origin"    # alternate infobox parameter name used on some pages
      - "wikidata:P495"     # Wikidata "country of origin" property — reliable fallback
    type: string
    default: null

  - field_name: weight_kg
    label: "Weight (kg)"
    description: "Typical adult weight, from the infobox (kept as string)."
    source: "infobox:weight"
    type: string
    default: null

  - field_name: categories
    label: "Wikipedia Categories"
    description: "All Wikipedia categories assigned to this page."
    source: "category_list"
    type: list
    default: []

  - field_name: wikidata_instance_of
    label: "Wikidata: instance of (P31)"
    description: >
      Wikidata Q-IDs for what this article is an instance of.
      Q-IDs are Wikidata's unique concept identifiers (e.g. Q39367 = "dog breed").
      Look up any Q-ID at https://www.wikidata.org/wiki/<Q-ID>
    source: "wikidata:P31"
    type: list
    default: []

# ---------------------------------------------------------------------------
# LLM batch extraction  (ONE API call per page — returns all fields at once)
# ---------------------------------------------------------------------------
#
# All fields listed here are sent to the LLM in a single call per page.
# The LLM returns a JSON object with answers to every question at once.
# Cost: 1 API call per accepted page, no matter how many fields are listed.

llm_extraction:

  # Optional preamble passed to the LLM before the field questions.
  # Use this to set context, define common rules, or give instructions that
  # apply to ALL fields (e.g. "if the page is about an extinct breed,
  # answer Unknown for every question").
  prompt_preamble: >
    Read the Wikipedia article carefully and answer each question below.
    Return ONLY a valid JSON object with exactly the keys listed.
    Do not include any explanation, markdown formatting, or extra text.

  fields:

    # Each field is one question in the batch.  The LLM answers all of them
    # in a single response JSON.

    - field_name: breed_size_category
      label: "Size Category"
      question: >
        Based on the article, what is the general size category of this dog breed?
        Choose the single best option: "Toy", "Small", "Medium", "Large", or "Giant".
        Answer "Unknown" if the article does not provide enough information.
      options:
        - "Toy"
        - "Small"
        - "Medium"
        - "Large"
        - "Giant"
        - "Unknown"
      default: "Unknown"

    - field_name: primary_purpose
      label: "Primary Purpose"
      question: >
        Based on the article, what was this dog breed originally developed to do?
        Give a short phrase, e.g. "herding livestock", "hunting small game",
        "companionship", "guarding", "search and rescue".
        Answer "Unknown" if the article does not make this clear.
      default: "Unknown"

# =============================================================================
# Sample output JSON record
# =============================================================================
#
# Metadata fields (_page_title, _wikipedia_url, _is_starting_page) are added
# automatically.  All other fields come from the "questions:" and
# "llm_extraction.fields:" definitions above.
#
# Success case — all fields found:
# {
#   "_page_title":            "Labrador Retriever",
#   "_wikipedia_url":         "https://en.wikipedia.org/wiki/Labrador_Retriever",
#   "_is_starting_page":      false,
#   "page_title":             "Labrador Retriever",
#   "breed_name":             "Labrador Retriever",
#   "country_of_origin":      "Canada",
#   "weight_kg":              "25–36 kg",
#   "categories":             ["Retrievers", "Dog breeds originating in Canada", ...],
#   "wikidata_instance_of":   ["Q39367"],
#   "breed_size_category":    "Large",      ← answered by LLM batch call
#   "primary_purpose":        "retrieving game"  ← answered by same LLM batch call
# }
#
# Missing-data case:
# {
#   "_page_title":            "Some Obscure Breed",
#   "breed_name":             "Some Obscure Breed",
#   "country_of_origin":      null,
#   "weight_kg":              null,
#   "categories":             [],
#   "wikidata_instance_of":   [],
#   "breed_size_category":    "Unknown",
#   "primary_purpose":        "Unknown"
# }
